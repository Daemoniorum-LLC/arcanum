[package]
name = "arcanum-core"
description = "Core traits, types, and primitives for the Arcanum cryptographic engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["cryptography", "traits", "core"]
categories = ["cryptography", "no-std"]

[features]
default = ["std", "serde", "encoding", "async"]

# Standard library support - enables all std-dependent functionality
std = [
    "alloc",
    "zeroize/std",
    "rand/std",
    "rand_core/std",
    "getrandom/std",
    "dep:parking_lot",
    "dep:lru",
    "dep:once_cell",
    "dep:chrono",
    "dep:uuid",
    "dep:rand_chacha",
]

# Alloc support without full std (Vec, String, Box)
alloc = [
    "zeroize/alloc",
    "dep:blake3",
]

# Encoding formats (requires alloc for String returns)
encoding = [
    "alloc",
    "dep:hex",
    "dep:base64ct",
    "dep:base32ct",
    "dep:bs58",
    "dep:bech32",
    "dep:multibase",
]

# Async trait support
async = ["dep:async-trait"]

# Serialization
serde = ["dep:serde", "secrecy/serde"]

# Hazardous materials (raw primitives)
hazmat = []

[dependencies]
# ═══════════════════════════════════════════════════════════════════════════════
# Category A: Always required (no_std compatible)
# ═══════════════════════════════════════════════════════════════════════════════
zeroize = { workspace = true }
secrecy = { workspace = true }
subtle = { workspace = true }
constant_time_eq = { workspace = true }
thiserror = { workspace = true }
generic-array = { workspace = true }
typenum = { workspace = true }
arrayvec = { workspace = true }
rand = { workspace = true }
rand_core = { workspace = true }

# ═══════════════════════════════════════════════════════════════════════════════
# Category D: Collection types (no_std compatible, always available)
# ═══════════════════════════════════════════════════════════════════════════════
bytes = { workspace = true }
smallvec = { workspace = true }
bitvec = { workspace = true }

# ═══════════════════════════════════════════════════════════════════════════════
# Category B: std-gated (optional)
# ═══════════════════════════════════════════════════════════════════════════════
parking_lot = { workspace = true, optional = true }
lru = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
rand_chacha = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }

# ═══════════════════════════════════════════════════════════════════════════════
# Category C: Encoding (optional, requires alloc)
# ═══════════════════════════════════════════════════════════════════════════════
hex = { workspace = true, optional = true }
base64ct = { workspace = true, optional = true }
base32ct = { workspace = true, optional = true }
bs58 = { workspace = true, optional = true }
bech32 = { workspace = true, optional = true }
multibase = { workspace = true, optional = true }

# ═══════════════════════════════════════════════════════════════════════════════
# Alloc-gated
# ═══════════════════════════════════════════════════════════════════════════════
blake3 = { workspace = true, optional = true }

# ═══════════════════════════════════════════════════════════════════════════════
# Async (optional)
# ═══════════════════════════════════════════════════════════════════════════════
async-trait = { workspace = true, optional = true }

# ═══════════════════════════════════════════════════════════════════════════════
# Serialization (already optional)
# ═══════════════════════════════════════════════════════════════════════════════
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
rstest = { workspace = true }
